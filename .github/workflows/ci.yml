name: API and MariaDB checks
on:
  push:
    branches: ["feat/**", "main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: reconciliation_test
          MARIADB_USER: reconciliation
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: reconciliation_test
      DB_USER: reconciliation
      DB_PASSWORD: test-only-password
      SOURCE_MAPPING_VERIFIED: "true"
      RUN_DB_TESTS: "1"
      API_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app migrations tests
      - name: Database migrations
        run: alembic upgrade head
      - name: Check migration version
        run: alembic current
      - name: Run tests
        run: pytest -q
